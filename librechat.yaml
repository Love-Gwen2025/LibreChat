# =============================================================================
# LikeChat 配置 (librechat.yaml)
# =============================================================================
version: 1.3.13

# 界面定制
interface:
  customWelcome: "欢迎使用 LikeChat"
  modelSelect: false
  marketplace:
    use: false
  # 不显示自定义页脚

# 注册控制: 关闭自由注册，只允许邀请码注册
registration:
  socialLogins: []

# 只启用 OpenAI 端点，其余全部不配置（自动隐藏）
endpoints:
  agents:
    allowedProviders:
      - "openAI"
  openAI:
    title: "OpenAI"
    models:
      default:
        - "gpt-5.6-sol"
        - "gpt-5.6-terra"
        - "gpt-5.6-luna"
        - "gpt-5.5"
        - "gpt-5.4"
        - "gpt-5.4-mini"
      fetch: false  # 关闭自动拉取，避免 image/audio/embedding 模型出现
    # 流式输出
    streamRate: 0

# 模型预设（全局模型选择器隐藏，默认进入 like助手）
modelSpecs:
  prioritize: true
  list:
    - name: "image-generation"
      label: "like助手"
      description: "可以聊天、分析，也可以生成和编辑图片"
      default: true
      showInMenu: true
      showOnLanding: true
      showIconOnLanding: false
      showAgentContactOnLanding: false
      iconURL: "agents"
      preset:
        endpoint: "agents"
        agent_id: "agent_biu_imagegen"
        agent_model: "gpt-5.5"
    - name: "gpt-5.5"
      label: "GPT-5.5"
      description: "最新旗舰模型"
      showInMenu: true
      preset:
        endpoint: "openAI"
        model: "gpt-5.5"
    - name: "gpt-5.4"
      label: "GPT-5.4"
      description: "强大且均衡"
      showInMenu: true
      preset:
        endpoint: "openAI"
        model: "gpt-5.4"
    - name: "gpt-5.4-mini"
      label: "GPT-5.4 Mini"
      description: "快速且经济"
      showInMenu: true
      preset:
        endpoint: "openAI"
        model: "gpt-5.4-mini"
